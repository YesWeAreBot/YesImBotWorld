<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f3f6fa">
<title>YesImBot World · 开放世界</title>
<style>
/* @include client/legacy.css */
/* @include client/studio.css */
/* @include client/world.css */
/* @include client/devices.css */
/* @include client/journey.css */
/* @include client/cockpit.css */
/* @include client/commands.css */
/* @include client/insights.css */
/* @include client/live.css */
/* @include client/readable.css */
/* @include client/attachments.css */
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到主要内容</a>
<div id="app">
  <aside id="sidebar" aria-label="主导航">
    <a class="brand" href="#overview" aria-label="YesImBot World 首页">
      <span class="brand-mark" id="brand-art"></span>
      <span><span class="t1">YesImBot <b>World</b></span><span class="t2">开放世界 · 无限可能</span></span>
    </a>
    <button id="studio-command" class="search-launch" aria-label="搜索页面和实体"><span class="search-glyph"></span><span>快速前往</span><kbd>⌘ K</kbd></button>
    <nav id="nav"></nav>
    <div class="sidebar-world"><span class="world-orbit" id="orbit-art"></span><span><strong>每个当下，新的可能</strong><small id="side-ver">OPEN WORLDS</small></span></div>
    <button id="studio-account" class="account-button"><span class="account-avatar">W</span><span><strong id="account-name">世界管理员</strong><small id="account-role">管理与观测</small></span><span class="account-more">···</span></button>
  </aside>
  <div id="backdrop"></div>
  <div id="content">
    <header id="topbar">
      <button id="btn-menu" class="icon-button" aria-label="打开导航菜单"></button>
      <span class="header-mark" id="header-art" aria-hidden="true"></span>
      <div class="breadcrumb"><span>WORLD</span><span class="breadcrumb-sep">/</span><strong id="route-title">总览</strong></div>
      <span id="tb-clock"></span><span class="header-spacer"></span>
      <span id="world-pill" class="pill off">连接中</span>
      <span id="tb-extra" class="sr-only"></span>
      <span class="connection-status" title="实时连接状态"><span id="sse-dot" class="off"></span><span id="connection-label">连接中</span></span>
      <button id="btn-theme" class="icon-button" aria-label="切换深浅主题"></button>
      <button id="btn-refresh" class="icon-button" aria-label="刷新当前视图"></button>
    </header>
    <main id="main" tabindex="-1" aria-live="polite"></main>
    <footer class="studio-footer"><span>YESIMBOT WORLD / OPEN ENDED</span><span>世界在展开，故事在发生。</span><span id="footer-sync">等待连接</span></footer>
  </div>
</div>
<nav id="mobile-nav" aria-label="快捷导航"></nav>
<div id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="box"><h3><span id="modal-title"></span><button class="x" id="modal-x" aria-label="关闭对话框">×</button></h3><div id="modal-body"></div></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
/* @include client/legacy.js */
/* @include client/readable.js */
/* @include client/attachments.js */
/* @include client/call-content.js */
/* @include client/call-reader.js */
/* @include client/world-art.js */
/* @include client/studio.js */
/* @include client/world.js */
/* @include client/devices.js */
/* @include client/journey.js */
/* @include client/cockpit.js */
/* @include client/commands.js */
/* @include client/insights.js */
/* @include client/live.js */
document.getElementById('brand-art').innerHTML = worldArt.logo({ decorative: true });
document.getElementById('header-art').innerHTML = worldArt.logo({ decorative: true });
document.getElementById('orbit-art').innerHTML = worldArt.orbit({ decorative: true });
var worldFavicon = document.createElement('link');
worldFavicon.rel = 'icon'; worldFavicon.type = 'image/svg+xml';
worldFavicon.href = 'data:image/svg+xml,' + encodeURIComponent(worldArt.logo({ decorative: true }));
document.head.appendChild(worldFavicon);
Studio.start();
</script>
</body>
</html>
