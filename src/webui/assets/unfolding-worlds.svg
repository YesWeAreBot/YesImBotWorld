<svg xmlns="http://www.w3.org/2000/svg" class="world-art world-art-hero studio-hero-art" viewBox="0 0 640 340" fill="none" role="img" aria-labelledby="world-art-hero-2-title"><title id="world-art-hero-2-title">一幅展开中的世界航图：不同地貌由开放的地平线连接，路径仍向远处生长</title>
